<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#f7f7f5">
<title>Offline · Elite Kitchens</title>
<style>
  /* Self-contained on purpose: this page is shown when nothing else can be loaded. Same colours as the app (--bg, --ink, --muted, --accent in app.css). */
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #f7f7f5; color: #252724; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 360px; text-align: center; }
  .brand { font-family: Georgia, "Times New Roman", serif; font-weight: 600; letter-spacing: .14em; font-size: 15px; }
  .sub { color: #686b64; font-size: 12px; margin-top: 2px; }
  h1 { font-size: 22px; font-weight: 600; margin: 34px 0 8px; }
  p { color: #686b64; margin: 0 0 26px; }
  button { min-height: 44px; padding: 10px 28px; border: 0; border-radius: 6px; background: #465c45; color: #fdfdfc; font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid #465c4566; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="brand">ELITE KITCHENS</div>
  <div class="sub">Lead OS</div>
  <h1>You're offline</h1>
  <p>Elite OS needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
  <button id="retry" type="button">Retry</button>
</main>
<script>
  // The address shown is the page that was asked for, so reloading asks for it again. (Opened directly, this page sends you to the app.)
  function retry() { if (location.pathname === '/offline.html') location.replace('/'); else location.reload(); }
  document.getElementById('retry').addEventListener('click', retry);
  window.addEventListener('online', retry);                                              // the connection came back: try by itself
</script>
</body>
</html>
