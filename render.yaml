# Render Blueprint: one web service + one Postgres database.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: elite-kitchens-lead-os
    runtime: node
    plan: starter            # always-on; free tier sleeps, which delays webhooks
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: lead-os-db, property: connectionString }
      - key: DATABASE_SSL
        value: "true"
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_TEMPLATE_NAME
        value: elite_kitchens_new_lead
      - key: WHATSAPP_TEMPLATE_LANG
        value: en
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
databases:
  - name: lead-os-db
    plan: basic-256mb
